
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlock My Heart ♡ — Izzy & Tre</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at top,#42243b,#19121e 65%,#0b0911);
  color:#ffeff6;
  font-family:system-ui,sans-serif;
  display:grid;
  place-items:center;
  padding:20px;
}

main{
  max-width:480px;
  width:100%;
  text-align:center;
}

h1,h2{
  font-family:Georgia,serif;
  font-weight:400;
}

h1{
  font-size:34px;
  margin:12px 0;
}

h2{font-size:27px}

.pink{color:#f6b8d5}

.muted{
  color:#dfc5d4;
  line-height:1.65;
}

.small{
  font-size:12px;
  color:#f6b8d5;
  letter-spacing:1.4px;
  font-weight:700;
}

.card{
  background:#ffffff0b;
  border:1px solid #ffffff2c;
  border-radius:20px;
  padding:25px 19px;
  margin:22px 0;
}

.puzzle{
  font-size:clamp(23px,6vw,35px);
  font-weight:750;
  background:#ffffff0b;
  padding:23px 8px;
  border-radius:12px;
  margin:18px 0;
}

.hint{
  color:#f4bbd6;
  font-size:14px;
  line-height:1.6;
}

input{
  width:100%;
  padding:15px;
  background:#110e19;
  border:1px solid #a57e99;
  border-radius:12px;
  color:white;
  text-align:center;
  font-size:18px;
  margin:15px 0 8px;
}

button,.btn{
  display:block;
  width:100%;
  border:0;
  border-radius:50px;
  padding:15px;
  background:#f3b5d3;
  color:#281522;
  font-size:15px;
  font-weight:750;
  text-decoration:none;
  margin-top:18px;
  cursor:pointer;
}

button:focus-visible,
input:focus-visible,
a:focus-visible{
  outline:3px solid white;
  outline-offset:3px;
}

.error{
  color:#ffbccf;
  font-size:13px;
  min-height:20px;
}

.heart{
  font-size:85px;
  color:#ffaacc;
  display:inline-block;
  animation:pop 1.5s ease both;
  filter:drop-shadow(0 0 18px #ed76ab8a);
}

@keyframes pop{
  0%{
    transform:scale(.02);
    opacity:0;
  }
  45%{
    transform:scale(1.4);
    opacity:1;
  }
  75%{
    transform:scale(.85);
  }
  100%{
    transform:scale(1);
  }
}

footer{
  color:#b99eae;
  font-size:11px;
  margin-top:20px;
}
</style>
</head>

<body>
<main>

  <div class="small">
    TOP SECRET • GIRLFRIEND ACCESS ONLY
  </div>

  <h1>
    Unlock My Heart <span class="pink">♡</span>
  </h1>

  <div class="muted" style="font-size:13px">
    The Certified Smart Girlfriend Edition™
  </div>

  <p id="progress" class="pink">
    🔒 01　🔒 02　🔒 03
  </p>

  <section
    class="card"
    id="game"
    aria-live="polite">
  </section>

  <footer>
    Made by Tre, with love and a questionable amount
    of free time. ♡
  </footer>

</main>

<script>
(function(){

const area=document.getElementById('game');
const progress=document.getElementById('progress');

let step=-1;
let tries=0;

const puzzles=[
  {
    label:'LOCK 1 — BIG BRAIN ACTIVITIES 🧠',
    title:'Decode This, My Love',
    intro:"Alright, my love. Starting off with a little brain exercise. Decode this message and let's see what you got. 😂",
    puzzle:'PDUV',
    hint:"💡 Hint: Take each letter three steps backward in the alphabet. You're welcome. 😂",
    answer:'MARS',
    success:'Okayyyy, Sherlock! 🕵️‍♀️😂 Look at you cracking codes and stuff. One lock down, two to go!'
  },
  {
    label:'LOCK 2 — CALCULATOR GIRLIE 🧮',
    title:'Time for Some Math',
    intro:"Okay, mathematician. Let's see what you got. And yes, you can use a calculator. I won't tell anybody. 😭",
    puzzle:'(85 × 9) + 12 = ?',
    hint:'Calculator privileges: officially granted. 🧮',
    answer:'777',
    success:'Look at you being all smart and stuff. 😂'
  },
  {
    label:'LOCK 3 — YOU BETTER KNOW THIS ONE 🥒',
    title:'The Final Lock',
    intro:"Okay, my love. This one should be easy. What's OUR secret word? You know exactly what I'm talking about. 👀",
    puzzle:'♡ ? ♡',
    hint:'No math, no cipher. Just our little secret.',
    answer:'PICKLE',
    success:'You remembered. Of course you did. Now we’re talking. 😂♡'
  }
];

function render(){

  progress.textContent=step===3
    ?'♥ ALL THREE LOCKS UNLOCKED ♥'
    :[0,1,2].map(i=>
      i<step?'♥':i===step?'🔓':'🔒'
    ).join('　');

  if(step===-1){

    area.innerHTML=`
      <div style="font-size:45px">💌</div>

      <h2>Hey, My Love! ♡</h2>

      <p class="muted">
        Soooo... I made you something. But obviously
        I couldn’t just give it to you. Where’s the fun
        in that? 😂
      </p>

      <p class="muted">
        You’ve got three locks to get through before
        you can see your surprise.
      </p>

      <p class="pink">
        No pressure or anything. I’m only judging
        a little. 🤭
      </p>

      <button id="next">
        Let’s Do This! 🔐
      </button>
    `;

    document.getElementById('next').onclick=()=>{
      step=0;
      render();
    };

    return;
  }

  if(step===3){

    area.innerHTML=`
      <div class="heart" aria-hidden="true">♥</div>

      <div class="small">
        100% CERTIFIED SMART GIRLFRIEND
      </div>

      <h2>Okayyyy, You Did It!! 😂💕</h2>

      <p>
        Look at you being all smart and stuff.
      </p>

      <p class="muted">
        Three locks, zero problems.
        Well... hopefully. 😂
      </p>

      <p class="muted">
        Anywayyyy, I made you a little something.
        Because apparently I have hobbies now,
        and one of them is making random surprises
        for my love. 🖤
      </p>

      <p class="pink">
        Go ahead, you’ve earned it. ♡
      </p>

      <a
        class="btn"
        href="https://treway69.github.io/izzy-and-tre/">
        Show Me My Surprise! 💕
      </a>

      <button id="replay">
        Play Again ♡
      </button>
    `;

    document.getElementById('replay').onclick=()=>{
      step=-1;
      render();
    };

    return;
  }

  const q=puzzles[step];

  area.innerHTML=`
    <div class="small">
      ${q.label}
    </div>

    <h2>
      ${q.title}
    </h2>

    <p class="muted">
      ${q.intro}
    </p>

    <div class="puzzle">
      ${q.puzzle}
    </div>

    <p class="hint">
      ${q.hint}
    </p>

    <form id="form">
      <input
        id="guess"
        placeholder="Your answer..."
        aria-label="Answer"
        autocomplete="off"
        required
      >

      <div
        class="error"
        id="feedback"
        role="status">
      </div>

      <button type="submit">
        Unlock ♡
      </button>
    </form>
  `;

  document.getElementById('form').onsubmit=e=>{

    e.preventDefault();

    const guess=document.getElementById('guess')
      .value.trim().toUpperCase();

    if(guess!==q.answer){

      tries++;

      document.getElementById('feedback').textContent=
        tries>=3
          ?'Not quite! Check that hint again, my love. 😂'
          :'Oop, not quite! Try again 😂';

      return;
    }

    tries=0;

    area.innerHTML=`
      <div class="pink" style="font-size:54px">
        ♥
      </div>

      <h2>Lock Unlocked! 🔓</h2>

      <p class="muted">
        ${q.success}
      </p>

      <button id="next">
        ${step===2
          ?'Reveal My Surprise! ♡'
          :'Next Challenge →'}
      </button>
    `;

    document.getElementById('next').onclick=()=>{
      step++;
      render();
    };

  };

}

render();

})();
</script>

</body>
</html>
